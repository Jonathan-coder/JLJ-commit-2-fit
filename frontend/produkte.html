<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Produkte · Commit2Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span class="wm">Commit2Fit</span>
    <span class="badge">Prototyp</span>
  </div>
  <main id="view" tabindex="-1">
    <h1>Produkt hinzufügen</h1>
    <p class="ctx" id="ctx" hidden></p>
    <div class="searchrow">
      <label class="sr-only" for="q">Produkt suchen</label>
      <input class="in" id="q" type="search" placeholder="Name oder Marke" autocomplete="off">
      <button class="btn primary" data-act="scan" aria-label="Produkt scannen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg>Scan</button>
    </div>
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-act="filt" data-f="all" aria-pressed="true">Alle</button>
      <button class="chip" data-act="filt" data-f="rec" aria-pressed="false">Zuletzt</button>
      <button class="chip" data-act="filt" data-f="fav" aria-pressed="false">Favoriten</button>
    </div>
    <ul class="rows" id="results"></ul>
    <p class="note" id="count"></p>
  </main>
  <nav class="tabs" aria-label="Hauptnavigation">
    <a class="tab" href="heute.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Heute</span></a>
    <a class="tab" href="produkte.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Produkte</span></a>
    <a class="tab" href="verlauf.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-7"/></svg><span>Verlauf</span></a>
    <a class="tab" href="fasten.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg><span>Fasten</span></a>
    <a class="tab" href="profil.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg><span>Profil</span></a>
  </nav>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/produkte.js"></script>
</body>
</html>
