<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fasten · Commit2Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span class="wm">Commit2Fit</span>
    <span class="badge">Prototyp</span>
  </div>
  <main id="view" tabindex="-1">
    <h1>Fasten</h1>
    <div class="chips" id="models" style="margin-top:0" role="group" aria-label="Fastenmodell">
      <button class="chip" data-m="16:8" aria-pressed="true">16:8</button>
      <button class="chip" data-m="18:6" aria-pressed="false">18:6</button>
      <button class="chip" data-m="20:4" aria-pressed="false">20:4</button>
      <button class="chip" data-m="Ramadan" aria-pressed="false">Ramadan</button>
    </div>
    <p class="sub" id="fDesc" style="margin-top:12px"></p>
    <div class="fring">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="88" fill="none" style="stroke:var(--line)" stroke-width="14"/>
        <circle id="fRing" cx="100" cy="100" r="88" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 552.92" transform="rotate(-90 100 100)"/>
      </svg>
      <div class="mid"><span id="fLabel"></span><b id="fTime" class="mono"></b><span id="fSub"></span></div>
    </div>
    <div class="times" id="times" hidden>
      <label class="fld">Beginn (Fajr)<input class="in" id="rf" type="time"></label>
      <label class="fld">Ende (Maghrib)<input class="in" id="rt" type="time"></label>
    </div>
    <button class="btn primary block" id="bStart" hidden>Fasten starten</button>
    <button class="btn block" id="bStop" hidden>Fasten beenden</button>
  </main>
  <nav class="tabs" aria-label="Hauptnavigation">
    <a class="tab" href="heute.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Heute</span></a>
    <a class="tab" href="produkte.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Produkte</span></a>
    <a class="tab" href="verlauf.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-7"/></svg><span>Verlauf</span></a>
    <a class="tab" href="fasten.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg><span>Fasten</span></a>
    <a class="tab" href="profil.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg><span>Profil</span></a>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/fasten.js"></script>
</body>
</html>
