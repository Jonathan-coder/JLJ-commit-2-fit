<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anmelden · Commit2Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span class="wm">Commit2Fit</span>
    <span class="badge">Prototyp</span>
  </div>
  <main id="view" tabindex="-1">
    <div class="auth">
      <h1 id="authTitle">Willkommen zurück</h1>
      <div class="seg" role="group" aria-label="Anmelden oder registrieren">
        <button id="btnLogin" type="button" aria-pressed="true">Anmelden</button>
        <button id="btnRegister" type="button" aria-pressed="false">Registrieren</button>
      </div>
      <form class="card form" id="authForm" novalidate>
        <label class="fld">E-Mail<input class="in" id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@beispiel.at"></label>
        <label class="fld">Passwort<input class="in" id="password" type="password" autocomplete="current-password"></label>
        <p class="sub" id="pwHint" hidden>Mindestens 8 Zeichen.</p>
        <button class="btn primary block" id="submit" type="submit">Anmelden</button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
      <p class="note">Mit demselben Konto kannst du dich auf mehreren Geräten anmelden. Zum Testen gibt es nach <span class="mono">npm run seed</span> im Backend das Konto <span class="mono">demo@commit2fit.test</span> mit dem Passwort <span class="mono">Demo1234!</span>.</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
