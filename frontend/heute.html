<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heute · Commit2Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <span class="wm">Commit2Fit</span>
    <span class="badge">Prototyp</span>
  </div>
  <main id="view" tabindex="-1">
    <p class="eyebrow" id="date"></p>
    <h1>Tagesbilanz</h1>
    <div id="alerts"></div>
    <section class="card">
      <div class="hero">
        <div class="ring">
          <svg viewBox="0 0 132 132" aria-hidden="true">
            <circle cx="66" cy="66" r="54" fill="none" style="stroke:var(--line)" stroke-width="12"/>
            <circle id="ringBar" cx="66" cy="66" r="54" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 339.29" transform="rotate(-90 66 66)"/>
          </svg>
          <div class="mid"><b id="kcal"></b><span id="kcalOf"></span></div>
        </div>
        <div>
          <p class="k" id="leftLabel"></p>
          <p class="big"><span id="left"></span> <small>kcal</small></p>
          <p class="sub" id="pct"></p>
        </div>
      </div>
    <div class="mac">
      <div class="mac-h"><span>Eiweiß</span><span class="mono" id="m-p-val"></span></div>
      <div class="track"><div class="fill" id="m-p-bar" style="background:var(--p)"></div></div>
    </div>
    <div class="mac">
      <div class="mac-h"><span>Kohlenhydrate</span><span class="mono" id="m-c-val"></span></div>
      <div class="track"><div class="fill" id="m-c-bar" style="background:var(--c)"></div></div>
    </div>
    <div class="mac">
      <div class="mac-h"><span>Fett</span><span class="mono" id="m-f-val"></span></div>
      <div class="track"><div class="fill" id="m-f-bar" style="background:var(--f)"></div></div>
    </div>
    </section>
    <div id="meals"></div>
    <p class="note">Tagebuch, Verlauf, Profil und Fasten-Timer werden vorerst nur in diesem Browser gespeichert. Das Backend hat dafür noch keine Endpunkte.</p>
  </main>
  <nav class="tabs" aria-label="Hauptnavigation">
    <a class="tab" href="heute.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Heute</span></a>
    <a class="tab" href="produkte.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Produkte</span></a>
    <a class="tab" href="verlauf.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-7"/></svg><span>Verlauf</span></a>
    <a class="tab" href="fasten.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M9.5 3h5"/></svg><span>Fasten</span></a>
    <a class="tab" href="profil.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></svg><span>Profil</span></a>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/util.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/heute.js"></script>
</body>
</html>
