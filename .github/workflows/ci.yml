# T056: run the backend test suite (incl. OpenAPI validation) with a PostgreSQL service on every pull request.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: commit2fit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commit2fit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:pw@localhost:5432/commit2fit_test
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # T081: run the suite with Node's built-in coverage and show the table on the run's summary page.
      - name: Run tests with coverage (migrations are applied by the test script)
        run: |
          npm run test:coverage | tee test-output.txt
          {
            echo '## Backend test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # T083: unit tests for the public functions of the frontend scripts (no dependencies to install).
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run frontend tests with coverage
        run: |
          npm run test:coverage | tee test-output.txt
          {
            echo '## Frontend test coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
